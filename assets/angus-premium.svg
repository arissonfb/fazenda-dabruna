<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" fill="none">
  <defs>
    <!-- Corpo: preto profundo com brilho no dorso -->
    <radialGradient id="bodyMain" cx="44%" cy="36%" r="62%" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#1e1c18"/>
      <stop offset="38%" stop-color="#0f0e0c"/>
      <stop offset="100%" stop-color="#060504"/>
    </radialGradient>

    <!-- Reflexo dourado no dorso (rim light de cima) -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#c9a84c" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#c9a84c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>

    <!-- Reflexo lateral suave (specular highlight no ombro) -->
    <radialGradient id="shoulderShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#2e2b24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0908" stop-opacity="0"/>
    </radialGradient>

    <!-- Brilho no pescoço/cabeça -->
    <radialGradient id="headShine" cx="60%" cy="35%" r="55%">
      <stop offset="0%"  stop-color="#252219"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>

    <!-- Sombra projetada no chão -->
    <radialGradient id="groundShadow" cx="50%" cy="20%" r="50%">
      <stop offset="0%"  stop-color="#000000" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro: brilho suave nas bordas iluminadas -->
    <filter id="glow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#c9a84c" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reflexo úmido do focinho -->
    <radialGradient id="muzzleGrad" cx="50%" cy="45%" r="52%">
      <stop offset="0%"  stop-color="#302b24"/>
      <stop offset="70%"  stop-color="#1a1713"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </radialGradient>

    <!-- Chifre -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#d4b060"/>
      <stop offset="60%"  stop-color="#8a6c30"/>
      <stop offset="100%" stop-color="#4a3a18"/>
    </linearGradient>
  </defs>

  <!-- ── Sombra no chão ── -->
  <ellipse cx="448" cy="628" rx="310" ry="38" fill="url(#groundShadow)" opacity="0.7"/>

  <!-- ══════════════════════════════════════
